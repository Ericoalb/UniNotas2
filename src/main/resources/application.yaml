spring:
  application:
    name: UniNotas
  datasource:
    url: jdbc:postgresql://localhost:5432/uninotas?createDatabaseIfNotExist=true
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jwt:
    expiration: ${JWT_EXPIRATION:86400000}
    key: ${JWT_KEY:chaveSecretaSuperSeguraParaAssinaturaDoTokenJwtUniNotas2026ComMaisDe256Bits}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

jwt:
  expiration: ${JWT_EXPIRATION:86400000}
  key: ${JWT_KEY:chaveSecretaSuperSeguraParaAssinaturaDoTokenJwtUniNotas2026ComMaisDe256Bits}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
